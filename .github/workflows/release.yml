# Builds the Python wheels and the source distribution and publishes a release.
#
# - Push a tag `v<version>` (matching `version` in Cargo.toml) to build, publish to PyPI and crates.io and create a
#   GitHub release with the changelog section of that version.
# - Run it by hand (workflow_dispatch) to only build and test the packages; nothing is published.
#
# Publishing uses trusted publishing (OpenID Connect), no API tokens are stored in the repository. Setup and the
# checklist for a release: docs/entwicklung.md, section "Veröffentlichen".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Package version matches the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]] && ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

  wheels:
    needs: version
    name: wheel ${{ matrix.target }} ${{ matrix.manylinux || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # abi3: one wheel per platform covers Python 3.10 and newer.
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          # ring's ARM assembly needs a newer cross GCC than the manylinux2014 image has.
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64, test: true }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64, test: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Install the wheel and import it
        if: matrix.test
        shell: bash
        run: |
          python -m venv /tmp/smoke
          if [[ "$RUNNER_OS" == Windows ]]; then py=/tmp/smoke/Scripts/python; else py=/tmp/smoke/bin/python; fi
          "$py" -m pip install --quiet python/dist/*.whl
          cd /tmp
          "$py" -c "import churchtools_api as ct; c = ct.Client('https://xyz.church.tools'); print(ct.__version__, ct.API_VERSION, c)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: python/dist/*.whl
          if-no-files-found: error

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  crate:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Package and verify the crate
        run: cargo package -p churchtools-api

  pypi:
    if: github.ref_type == 'tag'
    needs: [wheels, sdist, crate]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/churchtools-api/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true

  crates-io:
    if: github.ref_type == 'tag'
    needs: [version, wheels, sdist, crate]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/churchtools-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Already published?
        id: exists
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'churchtools-api release workflow' \
            "https://crates.io/api/v1/crates/churchtools-api/$VERSION")
          echo "published=$([[ $status == 200 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.exists.outputs.published == 'false'
        id: auth
      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: cargo publish -p churchtools-api
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    if: github.ref_type == 'tag'
    needs: [version, pypi, crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
