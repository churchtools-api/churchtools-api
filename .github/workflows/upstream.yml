# Checks once a day whether the ChurchTools demo instance runs a new version with a changed API description,
# and opens an issue with a summary if so. A new version with an identical description opens nothing.
# Needs no credentials: version and description of demo.church.tools are public.
name: ChurchTools version

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - id: check
        name: Compare with the demo instance
        run: python codegen/check_upstream.py --summary summary.md --github-output "$GITHUB_OUTPUT"
      - name: Open an issue
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          BUILD: ${{ steps.check.outputs.build }}
        run: |
          title="ChurchTools $VERSION (Build $BUILD): API-Beschreibung geändert"
          if gh issue list --state all --search "\"ChurchTools $VERSION (Build $BUILD)\" in:title" --json number \
              --jq 'length' | grep -qv '^0$'; then
            echo "Issue for $VERSION (build $BUILD) exists already"
            exit 0
          fi
          gh label create churchtools-version --color 1d76db \
            --description "Neue ChurchTools-Version mit geänderter API" 2>/dev/null || true
          gh issue create --title "$title" --body-file summary.md --label churchtools-version
