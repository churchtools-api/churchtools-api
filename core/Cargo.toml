[package]
name = "churchtools-api"
description = "Synchronous client for the ChurchTools REST API, generated from its OpenAPI description"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/churchtools-api"
readme = "../README.md"
keywords = ["churchtools", "api", "client", "rest", "church"]
categories = ["api-bindings", "web-programming::http-client"]
# The tests need the recorded responses in ../fixtures, which are not part of the package.
include = ["/src", "/LICENSE", "/NOTICE"]

[features]
# Internal: local server answering with recorded responses; used by the crate's
# own tests and doctests (enabled through the dev-dependency on itself below).
# Needs the repository checkout, not part of the public API.
replay = []

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
percent-encoding = "2.3.2"
# TLS: rustls with the `ring` crypto provider instead of the default aws-lc-rs.
# Both compile C code, but ring needs only a C compiler (no CMake, no NASM:
# its assembly is pre-assembled in the published crate) and builds much faster.
# Certificates come from the system trust store (rustls-platform-verifier).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "json", "query", "cookies", "multipart", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
serde_path_to_error = "0.1.20"
churchtools-api = { path = ".", features = ["replay"] }
