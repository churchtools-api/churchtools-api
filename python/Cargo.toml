[package]
name = "churchtools-py"
description = "Python bindings for churchtools-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
churchtools-core = { path = "../core" }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
